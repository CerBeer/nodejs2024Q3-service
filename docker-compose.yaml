services:
  # app:
  #   container_name: app
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - ${PORT}:${PORT}
  #   depends_on:
  #     - postgres
  #   env_file:
  #     - .env
  postgres:
    image: postgres
    container_name: postgres
    restart: always
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pglog:/var/log/postgresql
    networks:
      - internet
   
volumes:
  pgdata:
  pglog:

networks:
  internet:
    name: internet
    driver: bridge